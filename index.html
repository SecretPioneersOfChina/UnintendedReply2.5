    <!-- 错误处理 - 若脚本加载失败，显示错误信息而不是卡在启动画面 -->
    <script>
        window.addEventListener('error', function(e) {
            console.error('Script error:', e.message, 'at', e.filename, ':', e.lineno);
            var splash = document.getElementById('splash-screen');
            if (splash) {
                var err = document.createElement('div');
                err.style.cssText = 'color:#ff4d4f;margin-top:20px;font-size:14px;text-align:center;max-width:80%;line-height:1.6;';
                err.textContent = '加载失败: ' + e.message + '\n(' + e.filename + ':' + e.lineno + ')';
                splash.appendChild(err);
            }
        });
        // 超时保护：若5秒后仍未初始化，提示用户
        setTimeout(function() {
            if (document.getElementById('splash-screen') && !document.getElementById('app').classList.contains('active')) {
                var splash = document.getElementById('splash-screen');
                var err = document.createElement('div');
                err.style.cssText = 'color:#ff4d4f;margin-top:20px;font-size:14px;text-align:center;max-width:80%;';
                err.textContent = '加载超时，请刷新页面或检查网络连接。';
                splash.appendChild(err);
            }
        }, 5000);
    </script>
